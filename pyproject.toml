[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memetrader"
version = "0.6.1"
description = "Forward-only event-driven meme-token discovery and paper-trading bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
memetrader = "memetrader.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp/current"
